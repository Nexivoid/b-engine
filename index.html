<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Engine Detector</title>
<link rel="icon" type="image/x-icon" href="fav.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="https://github.com/Nexivoid/b-engine" target="_self" class="source-btn">
        <span class="code-icon">&lt;/&gt;</span> View Source Code
    </a>

    <div class="ambient">
        <div class="light-glow light-1"></div>
        <div class="light-glow light-2"></div>
        <div class="light-glow light-3"></div>
        <div class="light-glow light-4"></div>
        <div class="light-streak streak-1"></div>
        <div class="light-streak streak-2"></div>
    </div>

    <div class="container">
        <div class="engine-icon-container" id="icon-container"></div>
        <p class="main-text" id="browser-info">Detecting browser engine...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
